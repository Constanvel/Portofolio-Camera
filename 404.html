<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="e404.title">Not here — Constantine Rainer Simanjuntak</title>
<meta name="robots" content="noindex">
<!-- Every path on this page is root-absolute, not relative, and that is the
     whole of the fix. 404.html is served AT the address that was missed, so
     from /blog/an-old-link a `./css/style.css` resolves to /blog/css/style.css
     and the page arrives unstyled, in English, with the module that translates
     it failing in the console. The site says it lives at the root — canonical,
     sitemap and og:image all name the same origin — so the root is what these
     point at. If it is ever published under a sub-path as well, this is the
     one line to put back. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='16' y='24' font-size='28' font-family='Helvetica,Arial' text-anchor='middle' fill='%23111014'%3E*%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
<style>
  /* This page has no router and no stages, so it borrows the page styles and
     stands one section up by hand. .page is normally fixed to all four edges,
     which is where it got both its size and its centring — taken out of that
     it collapses to the width of its own text, so both have to be given back. */
  .page{ position:static; opacity:1; width:100%; min-height:100vh; }
  .page__t + .page__p{ margin-top:0; }
</style>
</head>
<body>
  <section class="page is-lit">
    <div class="page__in">
      <p class="page__p" style="margin-bottom:1.2rem">*</p>
      <h1 class="page__t" data-t="e404.t">not here</h1>
      <p class="page__p" data-t="e404.body">That address does not exist. The sections all live on one page.</p>
      <a class="page__cta" href="/" data-t="e404.cta">go to the start</a>
    </div>
  </section>

  <!-- GitHub Pages serves this for any path it does not have. The sections are
       hash routes on the index, so /experience is not a wrong address so much
       as an address written the old way — send those on rather than making the
       visitor find the section again by hand. Anything else stays put: an
       automatic bounce to the home page hides a genuinely broken link, from
       the visitor and from whoever put it there. -->
  <script>
    var routes = ['about','skills','works','experience','services','achievements','contact'];
    var last = location.pathname.replace(/\/+$/, '').split('/').pop().toLowerCase();
    if (routes.indexOf(last) > -1) location.replace('/#/' + last);
  </script>

  <!-- The whole of the language switch this page needs. No toggle: there is
       nothing on a 404 to change your mind about, so it only honours the
       choice already made on the real page, and reaches it through the same
       pickLang() so the two pages cannot disagree about what a browser asking
       for id-ID means. 'pf.lang' is the key js/main.js writes, and the try
       block is because localStorage throws outright in some privacy modes
       rather than returning null.
       A module, so it runs after the redirect above has already had its say —
       there is no point translating a page that is on its way somewhere. -->
  <script type="module">
    import { applyLang, pickLang } from '/js/i18n.js';
    var saved = null;
    try { saved = localStorage.getItem('pf.lang'); } catch (e) {}
    applyLang(pickLang(saved));
  </script>
</body>
</html>
